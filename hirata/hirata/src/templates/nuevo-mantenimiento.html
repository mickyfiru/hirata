<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Mantenimiento</title>
</head>
<body>
    <h2>Registrar Mantenimiento</h2>

    <form th:action="@{/mantenimientos/nuevo}" method="post">
        <label>Camión:</label>
        <select name="camionId" required>
            <option th:each="c : ${camiones}" th:value="${c.id}"
                    th:text="${c.patente + ' - ' + c.marca + ' ' + c.modelo}"></option>
        </select>
        <br><br>

        <label>Tipo:</label>
        <input type="text" name="tipo" required>
        <br><br>

        <label>Descripción:</label>
        <textarea name="descripcion"></textarea>
        <br><br>

        <button type="submit">Guardar</button>
    </form>

    <a href="/mantenimientos">Volver</a>
</body>
</html>
