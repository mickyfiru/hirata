<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mantenimientos</title>
</head>
<body>
    <h2>Mantenimientos</h2>
    <a href="/mantenimientos/nuevo">Registrar mantenimiento</a>

    <table border="1">
        <tr>
            <th>ID</th>
            <th>Fecha</th>
            <th>Camión</th>
            <th>Tipo</th>
            <th>Descripción</th>
        </tr>
        <tr th:each="m : ${mantenimientos}">
            <td th:text="${m.id}"></td>
            <td th:text="${m.fecha}"></td>
            <td th:text="${m.camion.patente}"></td>
            <td th:text="${m.tipo}"></td>
            <td th:text="${m.descripcion}"></td>
        </tr>
    </table>

    <br>
    <a href="/dashboard">Volver</a>
</body>
</html>
